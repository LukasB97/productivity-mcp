name: Release

on:
  # Manual only. Publishing requires an explicit maintainer decision.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build ProductivityMcp.sln --configuration Release --no-restore

      - name: Install email renderer
        shell: pwsh
        run: src/ProductivityMcp.App/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Test
        run: dotnet test --project tests/ProductivityMcp.Tests/ProductivityMcp.Tests.csproj --configuration Release --no-build --no-restore --filter "TestCategory!=Live"

      - name: Package with official OAuth desktop client
        shell: pwsh
        env:
          OAUTH_CLIENT_JSON_BASE64: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OAUTH_CLIENT_JSON_BASE64)) {
            throw "GOOGLE_OAUTH_CLIENT_JSON_BASE64 is required for official releases."
          }
          $bytes = [Convert]::FromBase64String($env:OAUTH_CLIENT_JSON_BASE64)
          $clientPath = Join-Path $env:RUNNER_TEMP 'google-oauth-client.json'
          try {
            [IO.File]::WriteAllBytes($clientPath, $bytes)
            ./scripts/package.ps1 -Runtime '${{ matrix.rid }}' -OAuthClientPath $clientPath
          } finally {
            Remove-Item -LiteralPath $clientPath -ErrorAction SilentlyContinue
          }

      - name: Collect archive
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem artifacts/packages -Recurse -File -Filter 'productivity-mcp-${{ matrix.rid }}.*')
          if ($archives.Count -ne 1) { throw 'Expected exactly one release archive.' }
          Copy-Item -LiteralPath $archives[0].FullName -Destination .

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: productivity-mcp-${{ matrix.rid }}
          path: productivity-mcp-${{ matrix.rid }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download packages
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum productivity-mcp-* > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes --title "Productivity MCP $RELEASE_TAG"
