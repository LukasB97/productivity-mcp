name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build ProductivityMcp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ProductivityMcp.sln --configuration Release --no-build --no-restore

      - name: Verify formatting
        if: runner.os == 'Linux'
        run: dotnet format ProductivityMcp.sln --verify-no-changes --no-restore
